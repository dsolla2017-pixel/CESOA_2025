<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Inativo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container { text-align: center; padding: 2rem; max-width: 600px; }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; opacity: 0.6; }
    h1 { font-size: 2rem; font-weight: 600; color: #e6edf3; margin-bottom: 1rem; }
    p { font-size: 1.1rem; line-height: 1.7; color: #8b949e; }
    .divider { width: 60px; height: 3px; background-color: #30363d; margin: 1.5rem auto; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔒</div>
    <h1>Este site está inativo</h1>
    <div class="divider"></div>
    <p>Este endereço foi encerrado e não está mais disponível.</p>
  </div>
</body>
</html>
